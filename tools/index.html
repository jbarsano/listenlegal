<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ListenLegal Tools</title>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:#f6f7fb;
  color:#1f2937;
}

.wrap{
  max-width:760px;
  margin:60px auto;
  padding:0 18px;
}

h1{
  font-size:26px;
  margin-bottom:10px;
}

.sub{
  color:#6b7280;
  margin-bottom:26px;
}

.card{
  background:white;
  border:1px solid #e6e8ef;
  border-radius:16px;
  padding:20px;
  box-shadow:0 10px 24px rgba(17,24,39,.06);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}

.title{
  font-weight:600;
  font-size:16px;
}

.desc{
  font-size:14px;
  color:#6b7280;
  margin-top:4px;
}

.open{
  border:1px solid #e6e8ef;
  border-radius:12px;
  padding:8px 14px;
  text-decoration:none;
  color:#111;
  background:white;
  white-space:nowrap;
}
.open:hover{background:#f3f4f6}

</style>
</head>
<body>

<div class="wrap">
  <h1>Tools</h1>
  <div class="sub"></div>

  <div class="card">
    <div>
      <div class="title">Income Screening Tool (FPL + MFI)</div>
      <div class="desc">Calculates household income as a percentage of Federal Poverty Level and Area Median Income.</div>
    </div>

    <a class="open" href="/tools/fpl-mfi-calculator/">Open</a>
  </div>

</div>

</body>
</html>
